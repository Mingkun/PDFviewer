<script>
window.AppBridge = {
  appVersion: function () { return '1.2.6 (windows)'; },
  checkUpdate: function () {
    fetch('https://5130599.best/Translator/downloads/pdfviewer-windows-version.json').then(function (r) { return r.json(); }).then(function (d) {
      if (d && !d.error) d.hasUpdate = (d.versionName || '') !== '1.2.6';
      if (window.onUpdateInfo) window.onUpdateInfo(d);
    }).catch(function () { if (window.onUpdateInfo) window.onUpdateInfo({ error: 'network' }); });
  },
  openExternal: function (url) {
    try { if (window.electronOpen) window.electronOpen(url); } catch (e) {}
  },
  downloadUpdate: function (url) {
    try { if (window.electronOpen) window.electronOpen(url); } catch (e) {}
    if (window.onUpdateDownload) window.onUpdateDownload('done');
  },
  ttsSpeak: function (text, id) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      var zh = /[\u4e00-\u9fff]/.test(text);
      u.lang = zh ? 'zh-CN' : 'en-US';
      u.rate = 1.0;
      var g = localStorage.getItem('pv_voiceGender') || 'default';
      var voices = speechSynthesis.getVoices() || [];
      var picked = null;
      if (g !== 'default' && voices.length) {
        var femaleRe = /huihui|xiaoxiao|yaoyao|zira|aria|jenny|tracy|susan|laura|sonia|libby|natasha|clara|female|女/i;
        var maleRe = /kangkang|yunxi|yunyang|david|mark|george|guy|andrew|brian|ryan|eric|male|男/i;
        var re = (g === 'female') ? femaleRe : maleRe;
        var langVoices = voices.filter(function (v) { return (v.lang || '').toLowerCase().indexOf(zh ? 'zh' : 'en') === 0; });
        picked = langVoices.filter(function (v) { return re.test(v.name); })[0] || null;
        if (!picked) picked = voices.filter(function (v) { return re.test(v.name); })[0] || null;
      }
      if (picked) u.voice = picked;
      else u.pitch = (g === 'female') ? 1.25 : ((g === 'male') ? 0.8 : 1.0);
      u.onend = function () { if (window.onTtsDone) window.onTtsDone(); };
      u.onerror = function () { if (window.onTtsDone) window.onTtsDone(); };
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) { if (window.onTtsDone) window.onTtsDone(); }
  },
  ttsStop: function () { try { speechSynthesis.cancel(); } catch (e) {} }
};
window.addEventListener('load', function () { try { speechSynthesis.getVoices(); } catch (e) {} });
window.addEventListener('wheel', function (e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  try {
    scale = Math.max(0.5, Math.min(4, scale + (e.deltaY < 0 ? 0.2 : -0.2)));
    if (pdf) render();
  } catch (err) {}
}, { passive: false });
window.addEventListener('keydown', function (e) {
  try {
    if (docKind === 'epub' && window.epubRendition) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { window.epubRendition.next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { window.epubRendition.prev(); }
    } else if (docKind === 'pdf' || docKind === 'pptx') {
      var total = readTotal();
      if ((e.key === 'ArrowRight' || e.key === 'PageDown') && pageNum < total) { displayPage(pageNum + 1); }
      else if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && pageNum > 1) { displayPage(pageNum - 1); }
    }
  } catch (err) {}
});
</script>

  });
}

function renderRecent() {
  var w = document.getElementById('recentWrap'); if (!w) return;
  var nat = null;
  try { if (window.AppBridge && AppBridge.getRecent) nat = JSON.parse(AppBridge.getRecent() || '[]'); } catch (e) { nat = null; }
  if (nat && nat.length) {
    nat.sort(function (a, b) { return (b.time || 0) - (a.time || 0); });
    w.style.display = '';
    var h2 = '<div style="font-size:11px;color:#9aa3b0;margin-bottom:4px">最近打开（点击直接打开 · 已记住阅读位置）</div>';
    nat.forEach(function (r, i) {
      h2 += '<div class="recentItem" data-i="' + i + '" style="display:flex;justify-content:space-between;gap:8px;padding:6px 4px;' + (i ? 'border-top:1px dashed #e3e8ef;' : '') + 'font-size:13px;color:#1f2630;cursor:pointer"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name || '?') + '</span><span style="color:#9aa3b0;font-size:11px;white-space:nowrap">⚡ ' + fmtRecentTime(r.time) + '</span></div>';
    });
    w.innerHTML = h2;
    Array.prototype.forEach.call(w.querySelectorAll('.recentItem'), function (el) {
      el.onclick = function () {
        var i = +el.getAttribute('data-i');
        try { document.getElementById('mclose').click(); } catch (e) {}
        try { AppBridge.openRecent(i); } catch (e) { setInfo('打开失败'); }
      };
    });
    return;
  }
  try {
    var rec = JSON.parse(localStorage.getItem('pv_recent') || '[]');
    rec.sort(function (a, b) { return (b.time || 0) - (a.time || 0); });   // 最近打开的排最前
    if (!rec.length) { w.style.display = 'none'; w.innerHTML = ''; return; }
    w.style.display = '';
    var h = '<div style="font-size:11px;color:#9aa3b0;margin-bottom:4px">最近打开（⚡=可直开，其余需重新选择文件）</div>';
    rec.forEach(function (r, i) {
      h += '<div class="recentItem" data-i="' + i + '" style="display:flex;justify-content:space-between;gap:8px;padding:6px 4px;' + (i ? 'border-top:1px dashed #e3e8ef;' : '') + 'font-size:13px;color:#1f2630;cursor:pointer"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name || '?') + '</span><span style="color:#9aa3b0;font-size:11px;white-space:nowrap">' + (r.data ? '⚡ ' : '') + fmtRecentTime(r.time) + '</span></div>';
    });
    w.innerHTML = h;
    Array.prototype.forEach.call(w.querySelectorAll('.recentItem'), function (el) {
      el.onclick = function () {
        var item = rec[+el.getAttribute('data-i')]; if (!item) return;
        if (item.data) {
          var bin = atob(item.data), u8 = new Uint8Array(bin.length);
          for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
          var nm = (item.name || '').toLowerCase(), ab = u8.buffer;
          try { recordRecent(item.name, ab); } catch (e) {}
          if (/\.csv$/.test(nm)) openXlsx(ab);
          else if (/\.(md|markdown)$/.test(nm)) openMd(ab);
          else openTxt(ab);
          document.getElementById('mclose').click();
        } else { document.getElementById('mclose').click(); document.getElementById('open').onclick(); }
      };
    });
  } catch (e) { w.style.display = 'none'; }
}
document.getElementById('searchb').onclick = function () {
  if (docKind !== 'pdf' || !pdf) { setInfo('搜索目前支持 PDF'); return; }
  document.getElementById('smodal').style.display = 'flex';
  document.getElementById('sinput').focus();
};
document.getElementById('sclose').onclick = function () { document.getElementById('smodal').style.display = 'none'; };
document.getElementById('sgo').onclick = function () {
  var q = document.getElementById('sinput').value.trim();
  var box = document.getElementById('sresults');
  if (!q) { box.innerHTML = ''; return; }
  box.innerHTML = '<div style="color:#9aa3b0;padding:8px">搜索中…</div>';
  var hits = [], total = pdf.numPages, i = 1;
  (function step() {
    if (i > total || hits.length >= 50) { showResults(q, hits); return; }
    pdf.getPage(i).then(function (pg) { return pg.getTextContent(); }).then(function (tc) {
      Array.prototype.forEach.call(tc.items, function (it) {
        if (it.str && it.str.indexOf(q) >= 0) {
          var tr = it.transform || [1, 0, 0, 1, 0, 0];
          var hh = Math.sqrt(tr[2] * tr[2] + tr[3] * tr[3]) || 10;
          hits.push({ pg: i, x: tr[4], y: tr[5], ctx: (it.str || '').slice(0, 60) });
        }
      });
      i += 1; step();
    }).catch(function () { i += 1; step(); });
  })();
};
function showResults(q, hits) {
  var box = document.getElementById('sresults');
  if (!hits.length) { box.innerHTML = '<div style="color:#9aa3b0;padding:8px">未找到「' + esc(q) + '」</div>'; return; }
  var pages = {};
  hits.forEach(function (h2) { (pages[h2.pg] = pages[h2.pg] || []).push(h2); });
  var h = '<div style="color:#9aa3b0;padding:4px 2px">找到 ' + hits.length + ' 处 · ' + Object.keys(pages).length + ' 页</div>';
  Object.keys(pages).forEach(function (p) {
    h += '<div style="font-weight:700;color:#1e88e5;margin-top:6px">第 ' + p + ' 页</div>';
    pages[p].slice(0, 5).forEach(function (x) {
      h += '<div class="sres" data-pg="' + x.pg + '" data-x="' + x.x + '" data-y="' + x.y + '" style="padding:5px 6px;border-top:1px dashed #e3e8ef;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">…' + esc(x.ctx) + '…</div>';
    });
  });
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('.sres'), function (el) {
    el.onclick = function () {
      var p = +el.getAttribute('data-pg');
      document.getElementById('smodal').style.display = 'none';
      displayPage(p);
      try {
        var ox = parseFloat(el.getAttribute('data-x')), oy = parseFloat(el.getAttribute('data-y'));
        setTimeout(function () {
          if (!curVp) return;
          var v = curVp.convertToViewportPoint(ox, oy);
          var c = document.getElementById('ocv');
          if (!c || c.style.display === 'none') return;
          var cf = c.getContext('2d');
          cf.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
          cf.fillStyle = 'rgba(255,214,0,.45)';
          cf.fillRect(Math.max(0, v[0] - 6), Math.max(0, v[1] - 14), 140, 24);
          setTimeout(function () { if (editMode) drawAnns(); else cf.clearRect(0, 0, c.width, c.height); cf.setTransform(1, 0, 0, 1, 0, 0); cf.clearRect(0, 0, c.width, c.height); if (editMode) drawAnns(); }, 1800);
        }, 400);
      } catch (e) {}
    };
  });
}
var menu = document.getElementById('menu');
document.getElementById('gear').onclick = function () {
  updateCompactBtn();
  if (compactOn() && String(document.getElementById('compactInfo').textContent).indexOf('紧凑模式：—') === 0) {
    setCompactInfo('已开启（打开 PDF 后生效）');
  }
  renderRecent();
  try { document.getElementById('verinfo').textContent = '当前版本：' + AppBridge.appVersion(); } catch (e) { document.getElementById('verinfo').textContent = '当前版本：-'; }
  document.getElementById('upinfo').textContent = '';
  document.getElementById('dl').style.display = 'none';
  menu.style.display = 'flex';
};
document.getElementById('mclose').onclick = function () { menu.style.display = 'none'; };
menu.addEventListener('click', function (e) { if (e.target === menu) menu.style.display = 'none'; });
document.getElementById('checkup').onclick = function () {
  document.getElementById('upinfo').textContent = '检查中…';
  try { AppBridge.checkUpdate(); } catch (e) { document.getElementById('upinfo').textContent = '检查失败'; }
};
var latest = null;
window.onUpdateInfo = function (d) {
  if (!d) return;
  if (d.error) { document.getElementById('upinfo').textContent = '检查失败：' + d.error; return; }
  if (d.hasUpdate) {
    latest = d;
    document.getElementById('upinfo').textContent = '发现新版本 ' + (d.versionName || d.versionCode);
    document.getElementById('dl').style.display = '';
  } else {
    document.getElementById('upinfo').textContent = '已是最新版本';
  }
};
window.onUpdateDownload = function (s) {
  var el = document.getElementById('upinfo');
  if (s === 'start') el.textContent = '下载中…（通知栏可见进度）';
  else if (s === 'permission') el.textContent = '需先允许「安装未知应用」：在刚打开的设置页中开启，返回后会自动继续安装';
  else if (s === 'installing') el.textContent = '权限已开启，正在打开安装…';
  else if (s === 'done') el.textContent = '下载完成，正在打开安装';
  else if (s === 'fail') el.textContent = '下载失败，请重试';
};
document.getElementById('dl').onclick = function () {
  if (latest && latest.apkUrl) { try { AppBridge.downloadUpdate(latest.apkUrl); } catch (e) {} }
};
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PDF 阅读器</title>
<script src="pdfjs/pdf.min.js"></script>
<style>
  html, body { margin:0; height:100%; background:#2b2f36; font-family:sans-serif; }
  body { display:flex; flex-direction:column; }
  #bar { display:flex; gap:6px; align-items:center; padding:6px 8px; background:#1e2126; color:#dfe3ea; font-size:14px; flex-wrap:wrap; flex-shrink:0; }
  #bar button { background:#3a4048; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:14px; cursor:pointer; }
  #stage { flex:1; overflow:auto; text-align:center; -webkit-overflow-scrolling:touch; }
  canvas { margin:8px auto; box-shadow:0 2px 12px rgba(0,0,0,.5); }
  #pageInput { width:52px; text-align:center; border-radius:6px; border:none; padding:6px 2px; font-size:14px; }
  #info { font-size:12px; color:#9aa3b0; }
  #hint { color:#8a94a6; font-size:13px; text-align:center; padding-top:40%; }
  #fpick { display:none; }
</style>
</head>
<body>
<div id="bar">
  <button id="open">📂 打开</button>
  <button id="print">🖨 打印</button>
  <input id="pageInput" type="number" value="0">
  <span id="total">/ 0</span>
  <span id="info"></span>
  <button id="gear" style="margin-left:auto">⚙</button>
</div>
<div id="stage"><div id="hint">点击「📂 打开」选择 PDF 文件</div><canvas id="cv" style="display:none"></canvas></div>
<div id="menu" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;align-items:center;justify-content:center;">
  <div style="width:min(320px,86vw);background:#fff;border-radius:12px;padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <strong style="font-size:15px;color:#1f2630">⚙ 系统菜单</strong>
      <button id="mclose" style="border:none;background:none;font-size:22px;color:#5a6472;cursor:pointer;line-height:1">×</button>
    </div>
    <div id="verinfo" style="font-size:13px;color:#555;margin-bottom:12px">当前版本：…</div>
    <button id="checkup" style="border:none;background:#e8590c;color:#fff;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer">检查更新</button>
    <button id="dl" style="display:none;border:none;background:#2f9e44;color:#fff;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;margin-left:8px">下载更新</button>
    <div id="upinfo" style="font-size:12px;color:#555;margin-top:10px"></div>
  </div>
</div>
<input type="file" id="fpick" accept="application/pdf">
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
var pdf = null, pageNum = 1, scale = 1.5, rendering = false, pending = null;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

function setInfo(s) { document.getElementById('info').textContent = s; }

document.getElementById('open').onclick = function () { document.getElementById('fpick').click(); };
document.getElementById('print').onclick = function () {
  if (!pdf) return;
  try { AppBridge.printPdf(); } catch (e) {}
};
document.getElementById('fpick').onchange = function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    pdfjsLib.getDocument({ data: new Uint8Array(fr.result) }).promise.then(function (doc) {
      pdf = doc;
      pageNum = 1;
      document.getElementById('total').textContent = '/ ' + doc.numPages;
      cv.style.display = '';
      var hint = document.getElementById('hint');
      if (hint) hint.style.display = 'none';
      render();
    }).catch(function (e) { setInfo('打开失败'); });
  };
  fr.readAsArrayBuffer(f);
};
var stage = document.getElementById('stage');
document.getElementById('pageInput').onchange = function () {
  var n = parseInt(this.value, 10);
  if (pdf && n >= 1 && n <= pdf.numPages) { pageNum = n; render(); }
  else if (pdf) this.value = pageNum;
};

function fitPage() {
  if (!pdf) return;
  pdf.getPage(pageNum).then(function (page) {
    var vp1 = page.getViewport({ scale: 1 });
    var pad = 16;
    var s = Math.min((stage.clientWidth - pad) / vp1.width, (stage.clientHeight - pad) / vp1.height);
    scale = Math.max(0.5, Math.min(4, s));
    render();
  });
}
var touchX = 0, touchY = 0, lastTap = 0;
var pinchActive = false, pinchDist = 0, pinchScale = 0, vizK = 1;
function dist2(t1, t2) {
  var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
stage.addEventListener('touchstart', function (e) {
  if (e.touches.length === 2) {
    pinchActive = true;
    pinchDist = dist2(e.touches[0], e.touches[1]);
    pinchScale = scale;
    vizK = 1;
  } else if (e.touches.length === 1) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
}, { passive: true });
stage.addEventListener('touchmove', function (e) {
  if (!pinchActive || e.touches.length !== 2) return;
  e.preventDefault();
  var d = dist2(e.touches[0], e.touches[1]);
  if (pinchDist > 0 && d > 0) {
    vizK = d / pinchDist;
    cv.style.transformOrigin = 'center center';
    cv.style.transform = 'scale(' + vizK + ')';
  }
}, { passive: false });
stage.addEventListener('touchend', function (e) {
  if (pinchActive) {
    if (e.touches.length < 2) {
      pinchActive = false;
      cv.style.transform = '';
      scale = Math.max(0.5, Math.min(4, pinchScale * vizK));
      if (pdf) render();
    }
    return;
  }
  if (e.changedTouches.length !== 1) return;
  var dx = e.changedTouches[0].clientX - touchX;
  var dy = e.changedTouches[0].clientY - touchY;
  if (pdf && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    var atRight = stage.scrollLeft + stage.clientWidth >= stage.scrollWidth - 4;
    var atLeft = stage.scrollLeft <= 4;
    if (dx < 0 && atRight && pageNum < pdf.numPages) { pageNum += 1; render(); }
    else if (dx > 0 && atLeft && pageNum > 1) { pageNum -= 1; render(); }
  }
  var now = Date.now();
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
    if (now - lastTap < 300) { fitPage(); lastTap = 0; }
    else { lastTap = now; }
  }
}, { passive: true });
stage.addEventListener('dblclick', function () { fitPage(); });
function render() {
  if (!pdf || rendering) { pending = pageNum; return; }
  rendering = true;
  pdf.getPage(pageNum).then(function (page) {
    var vp = page.getViewport({ scale: scale });
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.floor(vp.width * dpr);
    cv.height = Math.floor(vp.height * dpr);
    cv.style.width = Math.floor(vp.width) + 'px';
    cv.style.height = Math.floor(vp.height) + 'px';
    var opts = { canvasContext: ctx, viewport: vp };
    if (dpr !== 1) opts.transform = [dpr, 0, 0, dpr, 0, 0];
    return page.render(opts).promise;
  }).then(function () {
    rendering = false;
    document.getElementById('pageInput').value = pageNum;
    if (pending !== null && pending !== null) {
      var p = pending;
      pending = null;
      if (p !== pageNum) { pageNum = p; render(); }
    }
  }).catch(function () { rendering = false; });
}
var menu = document.getElementById('menu');
document.getElementById('gear').onclick = function () {
  try { document.getElementById('verinfo').textContent = '当前版本：' + AppBridge.appVersion(); } catch (e) { document.getElementById('verinfo').textContent = '当前版本：-'; }
  document.getElementById('upinfo').textContent = '';
  document.getElementById('dl').style.display = 'none';
  menu.style.display = 'flex';
};
document.getElementById('mclose').onclick = function () { menu.style.display = 'none'; };
menu.addEventListener('click', function (e) { if (e.target === menu) menu.style.display = 'none'; });
document.getElementById('checkup').onclick = function () {
  document.getElementById('upinfo').textContent = '检查中…';
  try { AppBridge.checkUpdate(); } catch (e) { document.getElementById('upinfo').textContent = '检查失败'; }
};
var latest = null;
window.onUpdateInfo = function (d) {
  if (!d) return;
  if (d.error) { document.getElementById('upinfo').textContent = '检查失败：' + d.error; return; }
  if (d.hasUpdate) {
    latest = d;
    document.getElementById('upinfo').textContent = '发现新版本 ' + (d.versionName || d.versionCode);
    document.getElementById('dl').style.display = '';
  } else {
    document.getElementById('upinfo').textContent = '已是最新版本';
  }
};
window.onUpdateDownload = function (s) {
  var el = document.getElementById('upinfo');
  if (s === 'start') el.textContent = '下载中…（通知栏可见进度）';
  else if (s === 'permission') el.textContent = '需先允许「安装未知应用」：在刚打开的设置页中开启，返回后会自动继续安装';
  else if (s === 'installing') el.textContent = '权限已开启，正在打开安装…';
  else if (s === 'done') el.textContent = '下载完成，正在打开安装';
  else if (s === 'fail') el.textContent = '下载失败，请重试';
};
document.getElementById('dl').onclick = function () {
  if (latest && latest.apkUrl) { try { AppBridge.downloadUpdate(latest.apkUrl); } catch (e) {} }
};
</script>
</body>
</html>

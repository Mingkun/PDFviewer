    if (err || typeof XLSX === 'undefined') { setInfo('打开失败'); return; }
    try {
      var wb = XLSX.read(buf, { type: 'array' });
      var html = '', texts = [];
      wb.SheetNames.forEach(function (sn) {
        var ws = wb.Sheets[sn];
        html += '<div style="font-size:13px;color:#7048a8;margin:10px 0 4px">📋 ' + esc(sn) + '</div>';
        html += XLSX.utils.sheet_to_html(ws);
        var csv = XLSX.utils.sheet_to_csv(ws);
        if (csv.trim()) texts.push(csv);
      });
      contentEl.innerHTML = '<div style="display:inline-block;text-align:left;max-width:100%;padding:12px">' + html.replace(/<td/g, '<td style="border:1px solid #dde4ec;padding:4px 8px"').replace(/<th/g, '<th style="border:1px solid #dde4ec;padding:4px 8px"') + '</div>';
      contentEl.style.background = '#fff';
      contentEl.style.display = 'block';
      var t = texts.join('\n');
      docPages = t.trim() ? chunksFromText(t) : [];
      docKind = 'xlsx';
      setTotal(docPages.length);
      if (autoReadOn()) readerToggle();
    } catch (e) { setInfo('打开失败'); }
  });
}
function openPptx(buf) {
  resetView();
  loadScript('libs/jszip.min.js', function (err) {
    if (err || typeof JSZip === 'undefined') { setInfo('打开失败'); return; }
    JSZip.loadAsync(buf).then(function (zip) {
      var names = [];
      zip.forEach(function (path, f) {
        var m = path.match(/^ppt\/slides\/slide(\d+)\.xml$/);
        if (m && !f.dir) names.push({ n: parseInt(m[1], 10), path: path });
      });
      names.sort(function (a, b) { return a.n - b.n; });
      docPages = [];
      var idx = 0;
      function next() {
        if (idx >= names.length) { finishPptx(); return; }
        zip.files[names[idx].path].async('string').then(function (xml) {
          var parts = [];
          xml.replace(/<a:t>([^<]*)<\/a:t>/g, function (m, t) { parts.push(t); return ''; });
          docPages.push(parts.join('\n'));
          idx += 1;
          next();
        }).catch(function () { docPages.push(''); idx += 1; next(); });
      }
      next();
    }).catch(function () { setInfo('打开失败'); });
  });
}
function finishPptx() {
  var html = '';
  for (var i = 0; i < docPages.length; i++) {
    html += '<div class="slideCard" data-slide="' + (i + 1) + '" style="display:none;text-align:left;max-width:100%;margin:12px;padding:16px;background:#fff;border-radius:10px;font-size:15px;line-height:1.8;color:#1f2630;white-space:pre-wrap"><div style="font-size:11px;color:#7048a8;margin-bottom:6px">幻灯片 ' + (i + 1) + ' / ' + docPages.length + '</div>' + esc(docPages[i] || '（无文字）') + '</div>';
  }
  contentEl.innerHTML = html;
  contentEl.style.display = 'block';
  docKind = 'pptx';
  setTotal(docPages.length);
  showSlide(1);
  if (autoReadOn()) readerToggle();
}
function showSlide(n) {
  var els = contentEl.querySelectorAll('[data-slide]');
  for (var i = 0; i < els.length; i++) els[i].style.display = 'none';
  var el = contentEl.querySelector('[data-slide="' + n + '"]');
  if (el) el.style.display = 'block';
}
function extractDocText(buf) {
  try {
    var u8 = new Uint8Array(buf);
    var out = [], cur = [];
    function flush() {
      if (cur.length >= 8) {
        var s = '';
        for (var k = 0; k < cur.length; k += 4096) {
          s += String.fromCharCode.apply(null, cur.slice(k, k + 4096));
        }
        out.push(s);
      }
      cur = [];
    }
    for (var i = 0; i + 1 < u8.length; i += 2) {
      var code = u8[i] | (u8[i + 1] << 8);
      var ok = (code >= 0x20 && code < 0x7F) || (code >= 0x4E00 && code <= 0x9FFF) || (code >= 0xA0 && code <= 0xFFFD && code !== 0xFEFF) || code === 0x0A || code === 0x0D || code === 0x09;
      if (ok) cur.push(code); else flush();
    }
    flush();
    return out.join('\n');
  } catch (e) { return ''; }
}
function openDoc(buf) {
  resetView();
  var txt = extractDocText(buf);
  if (txt.trim().length < 50) { setInfo('旧版 .doc 解析有限，建议另存为 .docx'); return; }
  docPages = chunksFromText(txt);
  contentEl.innerHTML = '<div style="display:inline-block;text-align:left;max-width:100%;padding:12px;font-size:15px;line-height:1.9;color:#1f2630;white-space:pre-wrap;word-break:break-word">' + esc(txt) + '</div>';
  contentEl.style.background = '#fff';
  contentEl.style.display = 'block';
  docKind = 'doc';
  setTotal(docPages.length);
  if (autoReadOn()) readerToggle();
}
function openEpub(buf) {
  resetView();
  loadScript('libs/epub.min.js', function (err) {
    if (err || typeof ePub === 'undefined') { setInfo('打开失败'); return; }
    contentEl.innerHTML = '<div id="epubBox" style="width:100%;height:100%;background:#fff"></div>';
    contentEl.style.display = 'block';
    try {
      var book = ePub(buf);
      var rendition = book.renderTo(document.getElementById('epubBox'), { width: '100%', height: '100%', flow: 'paginated' });
      window.epubBook = book;
      window.epubRendition = rendition;
      docKind = 'epub';
      setTotal(0);
      rendition.display().then(function () {
        if (autoReadOn()) readerToggle();
      }).catch(function () {});
    } catch (e) { setInfo('打开失败'); }
  });
}
function epubCollect(onDone) {
  var book = window.epubBook;
  var texts = [];
  var items = book && book.spine ? (book.spine.spineItems || []) : [];
  var i = 0;
  function step() {
    if (i >= items.length) { onDone(texts.join('\n')); return; }
    try {
      items[i].load(book.load.bind(book)).then(function (doc) {
        try { texts.push(doc && doc.body ? doc.body.textContent : ''); } catch (e) {}
        try { items[i].unload(); } catch (e) {}
        i += 1; step();
      }).catch(function () { i += 1; step(); });
    } catch (e) { i += 1; step(); }
  }
  step();
}
function displayPage(n) {
  pageNum = n;
  if (docKind === 'pdf') { render(); return; }
  if (docKind === 'pptx') { showSlide(n); document.getElementById('pageInput').value = n; return; }
}
function render() {
  if (!pdf || rendering) { pending = pageNum; return; }
  rendering = true;
  pdf.getPage(pageNum).then(function (page) {
    var vp = page.getViewport({ scale: scale });
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.floor(vp.width * dpr);
    cv.height = Math.floor(vp.height * dpr);
    cv.style.width = Math.floor(vp.width) + 'px';
    cv.style.height = Math.floor(vp.height) + 'px';
    var opts = { canvasContext: ctx, viewport: vp };
    if (dpr !== 1) opts.transform = [dpr, 0, 0, dpr, 0, 0];
    return page.render(opts).promise;
  }).then(function () {
    rendering = false;
    document.getElementById('pageInput').value = pageNum;
    if (pending !== null && pending !== null) {
      var p = pending;
      pending = null;
      if (p !== pageNum) { pageNum = p; render(); }
    }
  }).catch(function () { rendering = false; });
}
var menu = document.getElementById('menu');
document.getElementById('gear').onclick = function () {
  try { document.getElementById('verinfo').textContent = '当前版本：' + AppBridge.appVersion(); } catch (e) { document.getElementById('verinfo').textContent = '当前版本：-'; }
  document.getElementById('upinfo').textContent = '';
  document.getElementById('dl').style.display = 'none';
  menu.style.display = 'flex';
};
document.getElementById('mclose').onclick = function () { menu.style.display = 'none'; };
menu.addEventListener('click', function (e) { if (e.target === menu) menu.style.display = 'none'; });
document.getElementById('checkup').onclick = function () {
  document.getElementById('upinfo').textContent = '检查中…';
  try { AppBridge.checkUpdate(); } catch (e) { document.getElementById('upinfo').textContent = '检查失败'; }
};
var latest = null;
window.onUpdateInfo = function (d) {
  if (!d) return;
  if (d.error) { document.getElementById('upinfo').textContent = '检查失败：' + d.error; return; }
  if (d.hasUpdate) {
    latest = d;
    document.getElementById('upinfo').textContent = '发现新版本 ' + (d.versionName || d.versionCode);
    document.getElementById('dl').style.display = '';
  } else {
    document.getElementById('upinfo').textContent = '已是最新版本';
  }
};
window.onUpdateDownload = function (s) {
  var el = document.getElementById('upinfo');
  if (s === 'start') el.textContent = '下载中…（通知栏可见进度）';
  else if (s === 'permission') el.textContent = '需先允许「安装未知应用」：在刚打开的设置页中开启，返回后会自动继续安装';
  else if (s === 'installing') el.textContent = '权限已开启，正在打开安装…';
  else if (s === 'done') el.textContent = '下载完成，正在打开安装';
  else if (s === 'fail') el.textContent = '下载失败，请重试';
};
document.getElementById('dl').onclick = function () {
  if (latest && latest.apkUrl) { try { AppBridge.downloadUpdate(latest.apkUrl); } catch (e) {} }
};
</script>
